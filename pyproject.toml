[project]
name = "agro-ai"
version = "2.0.0"
description = "Agro AI Production Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "PyJWT[crypto]>=2.8",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "email-validator>=2.1.1",
    "openpyxl>=3.1.2",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
